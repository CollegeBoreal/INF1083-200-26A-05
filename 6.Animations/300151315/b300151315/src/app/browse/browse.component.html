<ActionBar class="bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="fas bar-icon" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
    <Label class="bar-title" text="Animations" col="1"></Label>
  </GridLayout>
</ActionBar>

<StackLayout class="page">
  <Label class="tag" text="IMPÉRATIVE · CODE"></Label>
  <Label class="title" text="view.animate()" textWrap="true"></Label>
  <Label class="subtitle" text="Opacité, translation, échelle et rotation enchaînées" textWrap="true"></Label>

  <AbsoluteLayout width="300" height="300" class="stage" borderRadius="20">
    <Image #cible src="res://logo" width="220" height="80" left="40" top="110" stretch="aspectFit" class="target"></Image>
  </AbsoluteLayout>

  <Button text="Animate" (tap)="animate(cible)" class="btn-animate"></Button>
</StackLayout>
