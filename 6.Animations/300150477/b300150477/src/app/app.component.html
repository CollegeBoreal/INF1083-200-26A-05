<RadSideDrawer [drawerTransition]="sideDrawerTransition">
  <GridLayout tkDrawerContent rows="auto, *" class="nt-drawer__content">
    <StackLayout
      row="0"
      backgroundColor="#123b56"
      padding="40 16 24 16"
    >
      <Label text="🏔️" fontSize="42" textAlignment="center"></Label>
      <Label
        text="Du Djurdjura aux Rocheuses"
        color="#f4b942"
        fontSize="20"
        fontWeight="bold"
        textAlignment="center"
        textWrap="true"
        marginTop="8"
      ></Label>
      <Label
        text="🇩🇿 Algérie → Canada 🇨🇦"
        color="#dcebf3"
        textAlignment="center"
        textWrap="true"
        marginTop="6"
      ></Label>
    </StackLayout>

    <ScrollView row="1" class="nt-drawer__body">
      <StackLayout>
        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/home')"
          (tap)="onNavItemTap('/home')"
        >
          <Label col="0" text="🏠" class="nt-icon"></Label>
          <Label col="1" text="Accueil" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/browse')"
          (tap)="onNavItemTap('/browse')"
        >
          <Label col="0" text="🧭" class="nt-icon"></Label>
          <Label col="1" text="Boussole" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/search')"
          (tap)="onNavItemTap('/search')"
        >
          <Label col="0" text="🔎" class="nt-icon"></Label>
          <Label col="1" text="Explorer" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/featured')"
          (tap)="onNavItemTap('/featured')"
        >
          <Label col="0" text="🏔️" class="nt-icon"></Label>
          <Label col="1" text="Sommets" class="p-r-10"></Label>
        </GridLayout>

        <StackLayout class="hr"></StackLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/settings')"
          (tap)="onNavItemTap('/settings')"
        >
          <Label col="0" text="ℹ️" class="nt-icon"></Label>
          <Label col="1" text="À propos" class="p-r-10"></Label>
        </GridLayout>
      </StackLayout>
    </ScrollView>
  </GridLayout>

  <GridLayout tkMainContent>
    <page-router-outlet></page-router-outlet>
  </GridLayout>
</RadSideDrawer>
