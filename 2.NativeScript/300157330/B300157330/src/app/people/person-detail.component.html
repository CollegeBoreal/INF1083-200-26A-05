<ActionBar title="⭐ Profil" backgroundColor="#111827" color="#FDE68A">
  @if (isAndroid) {
    <StackLayout orientation="horizontal" horizontalAlignment="left">
      <Label
        text="‹ Retour"
        color="#FDE68A"
        class="mr-6 text-lg"
        (tap)="goBack()"
      ></Label>
      <Label text="⭐ Profil" color="#FDE68A" class="text-xl font-bold"></Label>
    </StackLayout>
  }
</ActionBar>

<ScrollView backgroundColor="#111827">
  <StackLayout class="p-4">
    <Label
      [text]="person()?.name"
      textWrap="true"
      color="#FFFFFF"
      class="mb-4 text-3xl font-bold"
    ></Label>

    <StackLayout backgroundColor="#253247" class="mb-3 rounded-xl p-4">
      <Label
        text="🌍 Nationalité"
        color="#FDE68A"
        class="mb-2 text-lg font-bold"
      ></Label>
      <Label [text]="person()?.nationality" textWrap="true" color="#FFFFFF"></Label>
    </StackLayout>

    <StackLayout backgroundColor="#253247" class="rounded-xl p-4">
      <Label
        text="🍿 Films marquants"
        color="#FDE68A"
        class="mb-2 text-lg font-bold"
      ></Label>
      <Label
        [text]="formatAchievements(person()?.notableAchievements)"
        textWrap="true"
        color="#FFFFFF"
      ></Label>
    </StackLayout>
  </StackLayout>
</ScrollView>
