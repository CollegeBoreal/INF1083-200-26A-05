
<ActionBar>
  <Label text="Home"></Label>
</ActionBar>

<StackLayout [formGroup]="signUpForm">
  <TextField
    formControlName="email"
    hint="Email"
    keyboardType="email"
    autocorrect="false">
  </TextField>

  <TextField
    formControlName="password"
    hint="Password"
    secure="true">
  </TextField>

  <Button
    text="Sign Up"
    (tap)="onButtonTap()">
  </Button>
</StackLayout>
