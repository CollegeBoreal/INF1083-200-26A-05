<section class="hero">
  <h1>{{ titre }}</h1>
  <p>Étudiant : {{ nom }}</p>
  @if (connecte) {
    <span class="badge">Connecté</span>
  }
  <button (click)="saluer()">Cliquez-moi</button>
</section>

<h2>Utilisateurs (API REST)</h2>
<div class="grid">
  @for (u of users(); track u.id) {
    <div class="card">
      <h3>{{ u.name }}</h3>
      <p>{{ u.email }}</p>
      <small>{{ u.company.name }}</small>
    </div>
  }
</div>
