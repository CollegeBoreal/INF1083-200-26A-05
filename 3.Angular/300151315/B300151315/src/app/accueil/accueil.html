<h1>{{ titre }}</h1>

<section class="carte">
  <h2>Data Binding</h2>
  <p>{{ nom }}</p>
</section>

<section class="carte">
  <h2>Évènements</h2>
  <button (click)="saluer()">Cliquez-moi</button>
</section>

<section class="carte">
  <h2>Directives : *ngIf</h2>
  <div *ngIf="connecte" class="statut ok">Connecté</div>
  <div *ngIf="!connecte" class="statut ko">Déconnecté</div>
  <button (click)="basculerConnexion()">Changer l'état</button>
</section>

<section class="carte">
  <h2>Directives : *ngFor</h2>
  <ul>
    <li *ngFor="let nom of noms">{{ nom }}</li>
  </ul>
</section>
