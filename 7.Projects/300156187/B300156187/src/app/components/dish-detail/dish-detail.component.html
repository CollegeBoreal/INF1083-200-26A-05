<Page class="page" actionBarHidden="true">
  <ScrollView>
    <StackLayout>
      <!-- Skeleton + shimmer pendant le chargement -->
      <StackLayout *ngIf="loading">
        <GridLayout class="skel detail-skel">
          <StackLayout class="skel-shine"></StackLayout>
        </GridLayout>
        <GridLayout class="skel skel-line">
          <StackLayout class="skel-shine"></StackLayout>
        </GridLayout>
        <GridLayout class="skel skel-line short">
          <StackLayout class="skel-shine"></StackLayout>
        </GridLayout>
      </StackLayout>

      <!-- Détail du plat -->
      <StackLayout *ngIf="dish">
        <GridLayout>
          <Image [src]="dish.image" class="detail-img" stretch="aspectFill"></Image>
          <Button text="←" class="back-btn" horizontalAlignment="left" verticalAlignment="top" (tap)="goBack()"></Button>
        </GridLayout>

        <StackLayout class="detail-body">
          <Label [text]="dish.name" class="detail-title"></Label>
          <Label [text]="'⭐ ' + dish.rating + ' · ' + dish.category" class="rating detail-rating"></Label>
          <Label [text]="dish.description" class="description" textWrap="true"></Label>

          <GridLayout columns="auto, *, auto" class="qty-row">
            <Label text="Quantité" col="0" class="qty-label"></Label>
            <StackLayout col="1" orientation="horizontal" horizontalAlignment="center">
              <Button text="-" class="qty-btn" (tap)="decrease()"></Button>
              <Label [text]="quantity" class="qty-value"></Label>
              <Button text="+" class="qty-btn" (tap)="increase()"></Button>
            </StackLayout>
            <Label col="2" [text]="totalPrice + ' DA'" class="price detail-price"></Label>
          </GridLayout>

          <Button text="Ajouter au panier" class="btn-primary add-cart-btn" (tap)="addToCart()"></Button>
        </StackLayout>
      </StackLayout>
    </StackLayout>
  </ScrollView>
</Page>
