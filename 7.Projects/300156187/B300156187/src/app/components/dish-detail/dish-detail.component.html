<ScrollView>
  <StackLayout class="dish-detail-container" [class.dark]="theme.dark$ | async">
    <Label text="← Retour" class="back-link" (tap)="goBack()"></Label>

    <StackLayout *ngIf="loading" class="skeleton-wrap">
      <StackLayout class="skel-photo anim-shimmer"></StackLayout>
      <StackLayout class="skel-line anim-shimmer"></StackLayout>
      <StackLayout class="skel-line anim-shimmer"></StackLayout>
    </StackLayout>

    <StackLayout *ngIf="!loading && dish" class="content anim-fade">
      <Image [src]="dish.image" class="dish-photo" stretch="aspectFill"></Image>
      <Label [text]="dish.name" class="dish-name" textWrap="true"></Label>
      <Label [text]="dish.category + '  •  ⭐ ' + dish.rating" class="dish-meta"></Label>
      <Label [text]="dish.price + ' DA'" class="dish-price"></Label>
      <Label [text]="dish.description" class="dish-desc" textWrap="true"></Label>

      <Label text="Quantité" class="section-label"></Label>
      <GridLayout columns="auto, *, auto" class="qty-row">
        <Button col="0" text="−" class="qty-btn" (tap)="decrease()"></Button>
        <Label col="1" [text]="quantity" class="qty-value"></Label>
        <Button col="2" text="+" class="qty-btn" (tap)="increase()"></Button>
      </GridLayout>

      <Button [text]="'Ajouter au panier • ' + (dish.price * quantity) + ' DA'" class="add-cart-btn" (tap)="addToCart()"></Button>
      <Label *ngIf="addedMessage" [text]="addedMessage" class="added-msg"></Label>
    </StackLayout>

    <Label *ngIf="!loading && !dish" text="Plat introuvable." class="empty-msg"></Label>
  </StackLayout>
</ScrollView>
