<Page class="page" actionBarHidden="true">
  <ScrollView>
    <StackLayout class="res-container">
      <Label text="Réserver une table" class="page-title"></Label>

      <!-- Formulaire -->
      <StackLayout *ngIf="!confirmed">
        <Label text="Nom" class="field-label"></Label>
        <TextField [(ngModel)]="name" hint="Votre nom" class="input"></TextField>

        <Label text="Téléphone" class="field-label"></Label>
        <TextField [(ngModel)]="phone" hint="05 XX XX XX XX" keyboardType="phone" class="input"></TextField>

        <Label text="Date" class="field-label"></Label>
        <DatePicker [(ngModel)]="date" class="picker"></DatePicker>

        <Label text="Heure" class="field-label"></Label>
        <TimePicker [(ngModel)]="time" class="picker"></TimePicker>

        <Label text="Nombre de personnes" class="field-label"></Label>
        <StackLayout orientation="horizontal" class="persons-row">
          <Button text="-" class="qty-btn" (tap)="decrease()"></Button>
          <Label [text]="persons" class="qty-value"></Label>
          <Button text="+" class="qty-btn" (tap)="increase()"></Button>
        </StackLayout>

        <Label *ngIf="error" [text]="error" class="error-text"></Label>

        <Button text="Confirmer la réservation" class="btn-primary confirm-res-btn" (tap)="confirm()"></Button>
      </StackLayout>

      <!-- Confirmation -->
      <StackLayout *ngIf="confirmed" class="confirm-box">
        <Label text="🎉" class="confirm-emoji" horizontalAlignment="center"></Label>
        <Label text="Réservation confirmée !" class="confirm-title" horizontalAlignment="center"></Label>
        <Label text="Nous avons hâte de vous accueillir." class="muted" horizontalAlignment="center"></Label>
        <Button text="Nouvelle réservation" class="btn-primary confirm-btn" (tap)="newReservation()"></Button>
      </StackLayout>

      <!-- Mes réservations -->
      <Label text="Mes réservations" class="section-title"></Label>
      <Label *ngIf="cart.reservations.length === 0" text="Aucune réservation pour le moment." class="muted"></Label>
      <GridLayout *ngFor="let reservation of cart.reservations" class="card reservation-card" columns="auto, *">
        <Label text="📅" col="0" class="res-icon"></Label>
        <StackLayout col="1">
          <Label [text]="reservation.date + ' à ' + reservation.time" class="card-title"></Label>
          <Label [text]="reservation.persons + ' personne(s) · ' + reservation.name" class="muted"></Label>
        </StackLayout>
      </GridLayout>
    </StackLayout>
  </ScrollView>
</Page>
