<RadSideDrawer [drawerTransition]="sideDrawerTransition" [class.dark]="theme.dark$ | async">
  <GridLayout tkDrawerContent rows="auto, *" class="nt-drawer__content">
    <StackLayout row="0" class="drawer-header">
      <Image src="~/app/images/logo-wonderfood.png" width="72" height="72" stretch="aspectFit" horizontalAlignment="center" class="drawer-logo"></Image>
      <Label class="drawer-brand" text="Wonder Food's" horizontalAlignment="center"></Label>
      <Label class="drawer-footnote" text="Morchid, Oran" horizontalAlignment="center"></Label>
    </StackLayout>

    <ScrollView row="1" class="nt-drawer__body">
      <StackLayout>
        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/accueil')"
          (tap)="onNavItemTap('/accueil')"
        >
          <Label col="0" text="&#xf015;" class="nt-icon fas"></Label>
          <Label col="1" text="Accueil" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/menu')"
          (tap)="onNavItemTap('/menu')"
        >
          <Label col="0" text="&#xf2e7;" class="nt-icon fas"></Label>
          <Label col="1" text="Menu" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/panier')"
          (tap)="onNavItemTap('/panier')"
        >
          <Label col="0" text="&#xf07a;" class="nt-icon fas"></Label>
          <Label col="1" text="Panier" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/reservations')"
          (tap)="onNavItemTap('/reservations')"
        >
          <Label col="0" text="&#xf073;" class="nt-icon fas"></Label>
          <Label col="1" text="Réservations" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout
          columns="auto, *"
          class="nt-drawer__list-item"
          [class.-selected]="isComponentSelected('/profil')"
          (tap)="onNavItemTap('/profil')"
        >
          <Label col="0" text="&#xf007;" class="nt-icon fas"></Label>
          <Label col="1" text="Profil" class="p-r-10"></Label>
        </GridLayout>

        <StackLayout class="hr"></StackLayout>

        <GridLayout columns="auto, *" class="nt-drawer__list-item" (tap)="onLogoutTap()">
          <Label col="0" text="&#xf2f5;" class="nt-icon fas"></Label>
          <Label col="1" text="Déconnexion" class="p-r-10"></Label>
        </GridLayout>
      </StackLayout>
    </ScrollView>
  </GridLayout>

  <GridLayout tkMainContent>
    <page-router-outlet></page-router-outlet>
  </GridLayout>
</RadSideDrawer>
