<ActionBar [title]="city?.name" class="action-bar">
  <NavigationButton text="Retour" android.systemIcon="ic_menu_back" (tap)="goBack()"></NavigationButton>
</ActionBar>

<ScrollView>
  <StackLayout class="page">
    <GridLayout *ngIf="photo" class="photo" (loaded)="onPhoto($event)">
      <Image [src]="photo" stretch="aspectFill"></Image>
      <Label text="📷 Wikipédia" class="photo__credit" horizontalAlignment="right" verticalAlignment="bottom"></Label>
    </GridLayout>

    <StackLayout class="hero" [backgroundColor]="city?.color" (loaded)="onHero($event)">
      <Label [text]="city?.flag" class="hero__flag"></Label>
      <Label [text]="city?.name" class="hero__title"></Label>
      <Label [text]="city?.country" class="hero__subtitle"></Label>
      <Label [text]="'« ' + city?.tagline + ' »'" class="hero__tagline" textWrap="true"></Label>
      <StackLayout orientation="horizontal" class="hero__chips">
        <Label [text]="'🌍 ' + city?.region" class="hero__chip"></Label>
        <Label [text]="'🕒 ' + localTime + ' sur place'" class="hero__chip"></Label>
      </StackLayout>
    </StackLayout>

    <GridLayout columns="*, *, *" class="actions">
      <Button col="0" [text]="isFavorite ? '♥ Favori' : '♡ Favori'" class="btn-action" [class.btn-action--on]="isFavorite" (tap)="toggleFavorite($event)"></Button>
      <Button col="1" [text]="inTrip ? '✓ Au voyage' : '+ Voyage'" class="btn-action" [class.btn-action--on]="inTrip" [isEnabled]="!inTrip" (tap)="addToTrip()"></Button>
      <Button col="2" text="↗ Partager" class="btn-action" (tap)="share()"></Button>
    </GridLayout>

    <StackLayout class="card">
      <Label text="À PROPOS" class="card__label"></Label>
      <Label [text]="city?.description" class="card__text" textWrap="true"></Label>
    </StackLayout>

    <StackLayout class="card">
      <Label text="📜 UN PEU D'HISTOIRE" class="card__label"></Label>
      <ActivityIndicator *ngIf="loadingWiki" busy="true" [color]="city?.color" class="loader"></ActivityIndicator>
      <Label *ngIf="!loadingWiki" [text]="wiki?.history || 'Connectez-vous à Internet pour lire son histoire.'" class="card__text" textWrap="true"></Label>
      <Label *ngIf="wiki?.history" text="Source : Wikipédia (licence CC BY-SA)" class="card__hint history__source"></Label>
    </StackLayout>

    <StackLayout class="card">
      <Label text="À NE PAS MANQUER" class="card__label"></Label>
      <GridLayout *ngFor="let place of city?.highlights; let i = index" columns="auto, *" class="place">
        <Label col="0" [text]="i + 1" class="place__number" [backgroundColor]="city?.color"></Label>
        <Label col="1" [text]="place" class="place__name" textWrap="true"></Label>
      </GridLayout>
    </StackLayout>

    <StackLayout class="card" *ngIf="phrases">
      <Label [text]="'🗣️ PHRASES UTILES · ' + phrases.name.toUpperCase()" class="card__label"></Label>
      <GridLayout *ngFor="let p of phrases.items" columns="*, auto" class="phrase">
        <Label col="0" [text]="p.fr" class="phrase__fr" textWrap="true"></Label>
        <StackLayout col="1">
          <Label [text]="p.local" class="phrase__local" [color]="city?.color"></Label>
          <Label *ngIf="p.native" [text]="p.native" class="phrase__native"></Label>
        </StackLayout>
      </GridLayout>
    </StackLayout>

    <StackLayout class="card">
      <Label text="📝 MON CARNET DE VOYAGE" class="card__label"></Label>
      <TextView #noteView [text]="note" hint="Vos idées, souvenirs, adresses à ne pas oublier…" class="note__input" (textChange)="onNote($event)"></TextView>
      <GridLayout columns="*, auto" class="note__footer">
        <Label col="0" [text]="noteStatus" class="card__hint" textWrap="true"></Label>
        <Button col="1" text="Enregistrer" class="note__save" [backgroundColor]="city?.color" (tap)="saveNote(noteView)"></Button>
      </GridLayout>
    </StackLayout>

    <StackLayout class="card" *ngIf="rate">
      <Label text="💱 CONVERTISSEUR DE DEVISES" class="card__label"></Label>
      <GridLayout columns="*, auto" class="convert">
        <TextField #amountField col="0" text="100" keyboardType="number" class="convert__input" (textChange)="onAmount($event)"></TextField>
        <Label col="1" text="CAD" class="convert__code"></Label>
      </GridLayout>
      <StackLayout orientation="horizontal" class="convert__quick">
        <Label *ngFor="let v of [20, 50, 100, 500]" [text]="v + ' $'" class="chip" [class.chip--active]="amount === v" (tap)="setAmount(v, amountField)"></Label>
      </StackLayout>
      <Label [text]="'= ' + converted + ' ' + rate.code" class="convert__result" [color]="city?.color"></Label>
      <Label [text]="'1 CAD ≈ ' + rate.perCad + ' ' + rate.code + ' · taux indicatif'" class="card__hint"></Label>
    </StackLayout>

    <Label text="INFOS PRATIQUES" class="section-title"></Label>
    <GridLayout columns="*, *" rows="auto, auto" class="facts">
      <StackLayout row="0" col="0" class="fact">
        <Label text="☀️" class="fact__icon"></Label>
        <Label text="SAISON IDÉALE" class="fact__label"></Label>
        <Label [text]="city?.bestSeason" class="fact__value" textWrap="true"></Label>
      </StackLayout>
      <StackLayout row="0" col="1" class="fact">
        <Label text="🕒" class="fact__icon"></Label>
        <Label text="HEURE LOCALE" class="fact__label"></Label>
        <Label [text]="localTime + '  (' + city?.timezone + ')'" class="fact__value"></Label>
      </StackLayout>
      <StackLayout row="1" col="0" class="fact">
        <Label text="💰" class="fact__icon"></Label>
        <Label text="MONNAIE" class="fact__label"></Label>
        <Label [text]="city?.currency" class="fact__value" textWrap="true"></Label>
      </StackLayout>
      <StackLayout row="1" col="1" class="fact">
        <Label text="🗣️" class="fact__icon"></Label>
        <Label text="LANGUES" class="fact__label"></Label>
        <Label [text]="city?.language" class="fact__value" textWrap="true"></Label>
      </StackLayout>
    </GridLayout>
  </StackLayout>
</ScrollView>
