<ActionBar title="Maintenance" backgroundColor="#111827" color="white"><NavigationButton text="Menu" android.systemIcon="ic_menu_sort_by_size" (tap)="onDrawerButtonTap()"></NavigationButton></ActionBar><ScrollView backgroundColor="#111827"><StackLayout padding="20"><Label text="MAINTENANCE" color="#38BDF8" fontSize="28" fontWeight="bold"></Label><Label text="Keep your vehicle in good condition" color="#94A3B8" marginBottom="20"></Label><StackLayout backgroundColor="#1E293B" padding="15" borderRadius="15"><TextField hint="Service (Oil change)" [(ngModel)]="service" style="color: white; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><TextField hint="Date (YYYY-MM-DD)" [(ngModel)]="date" style="color: white; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><TextField hint="Mileage (km)" [(ngModel)]="mileage" keyboardType="number" style="color: white; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><Button text="ADD SERVICE" (tap)="addService()" backgroundColor="#0284C7" color="white" borderRadius="10"></Button></StackLayout><Label text="SERVICE HISTORY" color="white" fontSize="20" fontWeight="bold" marginTop="25" marginBottom="15"></Label><StackLayout *ngFor="let s of services; let i = index" backgroundColor="#1E293B" padding="15" borderRadius="12" marginBottom="10"><Label [text]="s.service" color="white" fontSize="22" fontWeight="bold"></Label><Label [text]="s.date" color="#CBD5E1"></Label><Label [text]="s.mileage + &quot; km&quot;" color="#CBD5E1"></Label><Label [text]="s.completed ? &quot;Completed&quot; : &quot;Pending&quot;" [color]="s.completed ? &quot;#34D399&quot; : &quot;#FBBF24&quot;" fontSize="16"></Label><Button *ngIf="!s.completed" text="MARK AS COMPLETED" (tap)="completeService(i)" backgroundColor="#047857" color="white" borderRadius="8"></Button><Button text="REMOVE" (tap)="removeService(i)" backgroundColor="#991B1B" color="white" borderRadius="8"></Button></StackLayout></StackLayout></ScrollView>
