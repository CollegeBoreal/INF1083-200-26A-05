<ActionBar title="My Garage" backgroundColor="#111827" color="white"><NavigationButton text="Menu" android.systemIcon="ic_menu_sort_by_size" (tap)="onDrawerButtonTap()"></NavigationButton></ActionBar><ScrollView backgroundColor="#111827"><StackLayout padding="20"><Label text="MY GARAGE" color="#38BDF8" fontSize="28" fontWeight="bold"></Label><Label text="Add and manage your vehicles" color="#94A3B8" marginBottom="20"></Label><StackLayout backgroundColor="#1E293B" padding="15" borderRadius="15"><TextField hint="Brand (Mazda)" [(ngModel)]="make" style="color: #FFFFFF; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><TextField hint="Model (Mazda 3)" [(ngModel)]="model" style="color: #FFFFFF; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><TextField hint="Year (2014)" [(ngModel)]="year" keyboardType="number" style="color: #FFFFFF; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><Button text="ADD VEHICLE" (tap)="addVehicle()" backgroundColor="#0284C7" color="white" borderRadius="10"></Button></StackLayout><Label text="YOUR VEHICLES" color="white" fontSize="20" fontWeight="bold" marginTop="25" marginBottom="15"></Label><StackLayout *ngFor="let v of vehicles; let i = index" backgroundColor="#1E293B" padding="15" borderRadius="12" marginBottom="10"><Label [text]="v.make + &quot; &quot; + v.model" color="white" fontSize="22" fontWeight="bold"></Label><Label [text]="v.year" color="#94A3B8"></Label><Button text="REMOVE" (tap)="removeVehicle(i)" backgroundColor="#991B1B" color="white" borderRadius="8"></Button></StackLayout></StackLayout></ScrollView>
