<ActionBar title="Expenses" backgroundColor="#111827" color="white"><NavigationButton text="Menu" android.systemIcon="ic_menu_sort_by_size" (tap)="onDrawerButtonTap()"></NavigationButton></ActionBar><ScrollView backgroundColor="#111827"><StackLayout padding="20"><Label text="EXPENSES" color="#38BDF8" fontSize="28" fontWeight="bold"></Label><Label text="Track your vehicle expenses" color="#94A3B8" marginBottom="20"></Label><StackLayout backgroundColor="#1E293B" padding="20" borderRadius="15" marginBottom="20"><Label text="TOTAL EXPENSES" color="#CBD5E1"></Label><Label [text]="total.toFixed(2) + &quot; CAD&quot;" color="#34D399" fontSize="32" fontWeight="bold"></Label></StackLayout><StackLayout backgroundColor="#1E293B" padding="15" borderRadius="15"><TextField hint="Category (Fuel, Insurance)" [(ngModel)]="category" style="color: white; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><TextField hint="Amount (CAD)" [(ngModel)]="amount" keyboardType="decimal" style="color: white; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><TextField hint="Date (YYYY-MM-DD)" [(ngModel)]="date" style="color: white; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><Button text="ADD EXPENSE" (tap)="addExpense()" backgroundColor="#0284C7" color="white" borderRadius="10"></Button></StackLayout><Label text="EXPENSE HISTORY" color="white" fontSize="20" fontWeight="bold" marginTop="25" marginBottom="15"></Label><StackLayout *ngFor="let e of expenses; let i = index" backgroundColor="#1E293B" padding="15" borderRadius="12" marginBottom="10"><Label [text]="e.category" color="white" fontSize="22" fontWeight="bold"></Label><Label [text]="e.amount.toFixed(2) + &quot; CAD&quot;" color="#34D399" fontSize="24"></Label><Label [text]="e.date" color="#CBD5E1"></Label><Button text="REMOVE" (tap)="removeExpense(i)" backgroundColor="#991B1B" color="white" borderRadius="8"></Button></StackLayout></StackLayout></ScrollView>
