<ActionBar title="Vehicle Search" backgroundColor="#111827" color="white"><NavigationButton text="Menu" android.systemIcon="ic_menu_sort_by_size" (tap)="onDrawerButtonTap()"></NavigationButton></ActionBar><ScrollView backgroundColor="#111827"><StackLayout padding="20"><Label text="VEHICLE SEARCH" color="#38BDF8" fontSize="28" fontWeight="bold"></Label><Label text="Explore vehicles using the NHTSA database" color="#94A3B8" textWrap="true" marginBottom="20"></Label><StackLayout backgroundColor="#1E293B" padding="15" borderRadius="15"><TextField hint="Enter brand (Mazda, Toyota, BMW)" [(ngModel)]="make" style="color: white; placeholder-color: #CBD5E1; background-color: #334155; padding: 12; border-radius: 8; margin-bottom: 10;"></TextField><Button text="SEARCH VEHICLES" (tap)="searchVehicles()" [isEnabled]="!loading" backgroundColor="#0284C7" color="white" borderRadius="10"></Button><ActivityIndicator [busy]="loading" color="#38BDF8"></ActivityIndicator></StackLayout><Label [text]="message" color="#34D399" fontSize="18" marginTop="20" marginBottom="15" textWrap="true"></Label><StackLayout *ngFor="let m of models" backgroundColor="#1E293B" padding="15" borderRadius="12" marginBottom="10"><Label [text]="m.Model_Name" color="white" fontSize="20" fontWeight="bold"></Label><Label [text]="m.Make_Name" color="#94A3B8"></Label></StackLayout><Label text="Data source: NHTSA vPIC API" color="#94A3B8" fontSize="12" marginTop="20"></Label></StackLayout></ScrollView>
